<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esqueceu a senha — Poli-Salas</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 24px; background: #f7f8fa; color: #222; }
        .card { max-width: 420px; background: #fff; border: 1px solid #dcdcdc; border-radius: 8px; padding: 20px; }
        .campo { margin-bottom: 14px; }
        label { display: block; font-weight: bold; margin-bottom: 6px; }
        input { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #bbb; border-radius: 6px; }
        button { padding: 9px 14px; border: none; border-radius: 6px; background: #1976d2; color: #fff; font-weight: bold; cursor: pointer; }
        .erro { color: #b71c1c; font-size: 13px; margin-top: 4px; }
        .voltar { display: inline-block; margin-top: 14px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Esqueceu a senha</h1>
        <p>Informe o e-mail cadastrado na sua conta para receber o link de redefinição.</p>

        <form method="post">
            {% csrf_token %}
            {% if form.non_field_errors %}
                <div class="erro">{{ form.non_field_errors }}</div>
            {% endif %}
            <div class="campo">
                <label for="id_email">E-mail:</label>
                {{ form.email }}
                {% for error in form.email.errors %}
                    <div class="erro">{{ error }}</div>
                {% endfor %}
            </div>
            <button type="submit">Enviar link de redefinição</button>
        </form>

        <a class="voltar" href="{% url 'login' %}">Voltar para o login</a>
    </div>
</body>
</html>
