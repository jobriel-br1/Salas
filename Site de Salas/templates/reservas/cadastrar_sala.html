{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Sala - Poli-Salas</title>
    <link rel="stylesheet" href="{% static 'cadastrar-sala.css' %}">
    <!-- Sem defer: aplica o tema salvo antes da página aparecer -->
    <script src="{% static 'cadastrar-sala.js' %}"></script>
</head>
<body>
    <header>
        <h1>Cadastrar Nova Sala</h1>
        <nav>
            <a href="{% url 'lista_salas' %}">Voltar às salas</a>
            <a href="{% url 'solicitar_reserva' %}">Solicitar reserva</a>

            <button type="button" id="botao-tema" class="botao-tema" aria-label="Alternar tema">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="4"/>
                    <line x1="12" y1="2" x2="12" y2="5"/>
                    <line x1="12" y1="19" x2="12" y2="22"/>
                    <line x1="2" y1="12" x2="5" y2="12"/>
                    <line x1="19" y1="12" x2="22" y2="12"/>
                    <line x1="4.9" y1="4.9" x2="7" y2="7"/>
                    <line x1="17" y1="17" x2="19.1" y2="19.1"/>
                    <line x1="4.9" y1="19.1" x2="7" y2="17"/>
                    <line x1="17" y1="7" x2="19.1" y2="4.9"/>
                </svg>
            </button>
        </nav>
    </header>

    <main>
        <form method="post" class="form-sala">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="botao-enviar">Salvar sala</button>
        </form>
    </main>
</body>
</html>
