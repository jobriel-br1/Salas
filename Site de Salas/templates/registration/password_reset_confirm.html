<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Definir nova senha — Poli-Salas</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 24px; background: #f7f8fa; color: #222; }
        .card { max-width: 440px; background: #fff; border: 1px solid #dcdcdc; border-radius: 8px; padding: 20px; }
        p { margin-bottom: 12px; }
        label { display: block; font-weight: bold; margin-bottom: 4px; }
        input { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #bbb; border-radius: 6px; }
        button { padding: 9px 14px; border: none; border-radius: 6px; background: #2e7d32; color: #fff; font-weight: bold; cursor: pointer; }
        .erro { color: #b71c1c; font-size: 13px; }
    </style>
</head>
<body>
    <div class="card">
        {% if validlink %}
            <h1>Definir nova senha</h1>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit">Salvar nova senha</button>
            </form>
        {% else %}
            <h1>Link inválido ou expirado</h1>
            <p class="erro">Este link de redefinição não é válido ou já foi utilizado.</p>
            <p><a href="{% url 'password_reset' %}">Solicitar um novo link</a></p>
        {% endif %}
    </div>
</body>
</html>
